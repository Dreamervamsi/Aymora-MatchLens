services:
  - type: web
    name: matchlens-backend
    env: python
    buildCommand: "pip install -r requirements.txt && pip install -e ."
    startCommand: "uvicorn matchlens.api.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_NAME
        value: "llama-3.1-8b-instant"
      - key: GROQ_TIMEOUT_SECONDS
        value: "60.0"
      - key: MATCHLENS_CORS_ORIGINS
        value: "https://aymora-match-lens.vercel.app,http://localhost:5173,http://localhost:3000"
      - key: MATCHLENS_CORS_ORIGIN_REGEX
        value: "https://.*\\.vercel\\.app|https://.*\\.app\\.github\\.dev|http://localhost:\\d+"
